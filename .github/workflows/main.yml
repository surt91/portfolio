name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: uv sync

    - name: build static sites
      run: DEBUG=1 uv run make publish

    - name: GitHub Pages action
      if: github.ref == 'refs/heads/master' && github.actor != 'dependabot[bot]'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: output
        force_orphan: true

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
            vulnerability-check: false
            base-ref: 3ed5b3b4
            head-ref: HEAD
            allow-licenses: Apache-2.0, PSF-2.0, MIT, MPL-1.1, MPL-2.0, LGPL-2.1, LGPL-2.1-or-later, LGPL-2.1-only, 0BSD, BSD-2-Clause, BSD-3-Clause, Python-2.0, ZPL-2.1
            allow-dependencies-licenses: pkg:pypi/cssmin, pkg:pypi/typogrify, pkg:pypi/python-dateutil